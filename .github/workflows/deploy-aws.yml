name: Deploy to AWS App Runner

# Push to master → run migrations → build the container → push to ECR →
# tell App Runner to deploy it. workflow_dispatch exists so a deploy can be
# re-run without an empty commit if a step fails for an infra reason (an
# ECR throttle, a transient AWS API error) rather than a code reason.
on:
  push:
    branches: [master]
  workflow_dispatch:

# id-token: write is what lets `aws-actions/configure-aws-credentials` trade
# this workflow run's identity for temporary AWS credentials via OIDC — the
# whole reason no AWS access key ever has to live in a GitHub secret.
permissions:
  id-token: write
  contents: read

# Requires, under Settings → Secrets and variables → Actions:
#   Variables (plain — these identify things, they don't grant access):
#     AWS_DEPLOY_ROLE_ARN, APP_RUNNER_SERVICE_ARN
#   Secrets (encrypted — this one *is* a credential):
#     DATABASE_URL

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: bandhantak

jobs:
  # Runs before the image build so a migration that fails blocks the deploy —
  # shipping code that expects a column the database doesn't have yet is
  # worse than not deploying.
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  build-and-deploy:
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assume AWS deploy role (OIDC — no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # A role ARN, not a credential — it identifies which role to assume,
          # it doesn't authenticate anything. Set as a repo *variable*
          # (Settings → Secrets and variables → Actions → Variables), not a
          # secret: secrets are for values that grant access by themselves.
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$REGISTRY/$ECR_REPOSITORY:latest" \
            .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"

      # Explicit rather than relying on App Runner's "auto deploy on new
      # image" watcher — that polls ECR on its own schedule, this is
      # immediate and its success/failure shows up in this workflow run.
      - name: Deploy to App Runner
        run: |
          aws apprunner start-deployment \
            --service-arn "${{ vars.APP_RUNNER_SERVICE_ARN }}"

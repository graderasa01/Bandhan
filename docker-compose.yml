services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: bandhantak
      POSTGRES_PASSWORD: bandhantak_dev
      POSTGRES_DB: bandhantak
    ports:
      # 55432, not 5432 — this machine already has a native Postgres bound to
      # 5432 on the IPv4 wildcard, which silently intercepted connections
      # meant for this container (that's what looked like a bad password).
      - "55432:5432"
    volumes:
      - bandhantak_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bandhantak -d bandhantak"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  bandhantak_pgdata:
